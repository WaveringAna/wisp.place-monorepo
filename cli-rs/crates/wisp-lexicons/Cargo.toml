[package]
name = "wisp-lexicons"
description = "Rust bindings for the place.wisp.* lexicons, generated by jacquard-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["place_wisp"]
place_wisp = []

[dependencies]
jacquard-common.workspace = true
jacquard-derive.workspace = true
jacquard-lexicon.workspace = true
miette.workspace = true
serde.workspace = true
thiserror.workspace = true

[lints.rust]
non_snake_case = "allow"
unused_imports = "allow"

# Generated code; lints belong upstream in jacquard-codegen.
[lints.clippy]
all = "allow"
