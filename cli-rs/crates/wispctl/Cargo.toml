[package]
name = "wispctl"
description = "CLI for wisp.place - deploy static sites to the AT Protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wispctl"
path = "src/main.rs"

# `cargo binstall` downloads the published release binaries instead of compiling.
# Linux targets (gnu or musl) all get the static musl build.
[package.metadata.binstall]
pkg-url = "https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-{ target-arch }-linux"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-aarch64-darwin"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-x86_64-darwin"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-x86_64-windows.exe"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-x86_64-windows.exe"

[dependencies]
wispplace-core = { path = "../wispplace-core" }
wispplace-lexicons = { path = "../wispplace-lexicons" }
wispplace-ui = { path = "../wispplace-ui" }
anyhow.workspace = true
clap.workspace = true
jacquard.workspace = true
jacquard-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
rustls.workspace = true
base64.workspace = true
tempfile.workspace = true
futures-util.workspace = true
flate2.workspace = true
jacquard-lexicon.workspace = true
http.workspace = true
chrono.workspace = true
serde_html_form.workspace = true
webbrowser.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
jacquard-common.workspace = true
rusqlite.workspace = true
keyring.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustls-native-certs.workspace = true
webpki-root-certs.workspace = true
