# Lint and test the shipped Rust CLI (cli-rs/). build-wispctl.yml builds the
# same workspace through the root Nix flake and publishes it to Cachix.
when:
  - event: ["push", "manual"]
    branch: main
  - event: ["pull_request"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - git
  - gcc
  - cargo
  - rustc
  - clippy
  - rustfmt
  - cacert

environment:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "never"
  # Tests must never touch a real keychain or open a browser.
  WISPCTL_NO_KEYCHAIN: "1"
  WISPCTL_NO_BROWSER: "1"

steps:
  - name: check formatting
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      # wispplace-lexicons is generated by jacquard-codegen and not rustfmt-formatted.
      cargo fmt --check -p wispplace-core -p wispplace-ui -p wispctl

  - name: clippy
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      cargo clippy --locked --workspace --all-targets -- -D warnings

  - name: test
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      export SSL_CERT_FILE="$HOME/.nix-profile/etc/ssl/certs/ca-bundle.crt"
      test -r "$SSL_CERT_FILE"
      cargo test --locked --workspace

  - name: release build
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      # The release profile's fat LTO needs more memory than a small CI VM
      # has; thin LTO checks the same build. Release packaging will use fat.
      CARGO_PROFILE_RELEASE_LTO=thin cargo build --locked --release -p wispctl
      ls -l target/release/wispctl
