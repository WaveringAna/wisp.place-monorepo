# Build, lint and test the Rust port of wispctl (cli-rs/). The TypeScript CLI
# in cli/ is still the shipped one (see build-wispctl.yml); this only keeps the
# port green until it replaces it.
when:
  - event: ["push", "manual"]
    branch: main
  - event: ["pull_request"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - git
  - gcc
  - cargo
  - rustc
  - clippy
  - rustfmt

environment:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "never"
  # Tests must never touch a real keychain or open a browser.
  WISPCTL_NO_KEYCHAIN: "1"
  WISPCTL_NO_BROWSER: "1"

steps:
  - name: check formatting
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      # wisp-lexicons is generated by jacquard-codegen and not rustfmt-formatted.
      cargo fmt --check -p wisp-core -p wisp-ui -p wispctl

  - name: clippy
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      cargo clippy --locked --workspace --all-targets -- -D warnings

  - name: test
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      cargo test --locked --workspace

  - name: release build
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      cd cli-rs
      # The release profile's fat LTO needs more memory than a small CI VM
      # has; thin LTO checks the same build. Release packaging will use fat.
      CARGO_PROFILE_RELEASE_LTO=thin cargo build --locked --release -p wispctl
      ls -l target/release/wispctl
