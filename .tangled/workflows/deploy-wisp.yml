---
when:
  - event:
      - push
    branch:
      - main
  - event:
      - manual
engine: nixery
clone:
  skip: false
  depth: 1
  submodules: true
dependencies:
  nixpkgs:
    - git
    - nodejs
  github:NixOS/nixpkgs/nixpkgs-unstable:
    - bun
environment:
  WISP_HANDLE: wisp.place
  SITE_PATH: docs/dist
  SITE_NAME: docs
steps:
  - name: Initialize submodules
    command: |
      git submodule update --init --recursive
  - name: Build wisp-cli
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"

      cd cli

      bun install
      bun link

      cd ..
  - name: Build docs
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"

      cd docs
      bun install
      bun run build
  - name: Deploy to Wisp.place
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"

      pwd
      ls

      bun run ./cli/dist/index.js "$WISP_HANDLE" \
        --path "$SITE_PATH" \
        --site "$SITE_NAME" \
        --password "$WISP_APP_PASSWORD"
