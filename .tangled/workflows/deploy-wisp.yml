---
when:
  - event:
      - push
    branch:
      - main
  - event:
      - manual
engine: microvm
clone:
  skip: false
  depth: 1
  submodules: true
dependencies:
  - git
  - nodejs
  - gcc
  - glibc
  - github:NixOS/nixpkgs/nixpkgs-unstable#bun
environment:
  WISP_HANDLE: wisp.place
  SITE_PATH: docs/dist
  SITE_NAME: docs
steps:
  - name: Initialize submodules
    command: |
      git submodule update --init --recursive
  - name: Install dependencies
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      bun install
  - name: Build docs
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"

      cd docs
      bun install
      bun run build
  - name: Deploy to Wisp.place
    command: |
      set -euo pipefail
      export PATH="$HOME/.nix-profile/bin:$PATH"
      # Pinned and installed under $HOME, not the read-only Nix store.
      npm install --global --prefix "$HOME/.local" wispctl@2.1.0
      export PATH="$HOME/.local/bin:$PATH"

      wispctl deploy "$WISP_HANDLE" \
        --path "$SITE_PATH" \
        --site "$SITE_NAME" \
        --password "$WISP_APP_PASSWORD"
