<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Notes on building software, systems, and useful things." />
    <title>Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      THESIS: The blog shares the docs theme — same warm-beige / slate-violet palette,
      bubblegum accent, sharp corners, grain, and JetBrains Mono chrome.
      OWN-WORLD: Mono on chrome and code, sans prose, terminal-style code blocks, accent pips.
      STORY: Find a note by title, date, or summary, then read it.
      FIRST VIEWPORT: Small navigation, a direct Blog heading, and the beginning of the post list.
      FORM: Static HTML, CSS, and JavaScript; posts live in posts.js as HTML.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <header class="site-header">
      <div class="shell header-inner">
        <a class="site-name" href="index.html"><span class="site-mark" aria-hidden="true"></span>Your Name</a>
        <nav aria-label="Primary navigation">
          <a href="index.html">Blog</a>
          <a href="#about">About</a>
          <a href="feed.xml">RSS</a>
        </nav>
      </div>
    </header>

    <main class="shell">
      <section class="masthead" aria-labelledby="page-title">
        <p class="kicker">Engineering notes</p>
        <h1 id="page-title">Blog</h1>
        <p>Notes on software, systems, and building things.</p>
      </section>

      <section id="posts" aria-labelledby="posts-heading">
        <div class="section-heading">
          <h2 id="posts-heading">Posts</h2>
          <span id="post-count" class="muted"></span>
        </div>
        <div id="post-list" class="post-list" aria-live="polite"></div>
      </section>

      <section class="about" id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">About</h2>
        <p>
          I’m a software engineer writing about reliable systems, developer tools, and the work
          between an idea and a working implementation.
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© 2025 Your Name</span>
        <a href="mailto:you@example.com">Contact</a>
      </div>
    </footer>

    <script src="posts.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
