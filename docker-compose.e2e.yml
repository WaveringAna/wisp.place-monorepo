services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wisp
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wisp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - e2e_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - e2e_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/wisp-e2e

  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LOCAL_DEV: "true"
      PORT: "8000"
      DOMAIN: http://127.0.0.1:8000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wisp
      REDIS_URL: redis://redis:6379
      SKIP_ADMIN_SETUP: "true"
      DISABLE_DNS_WORKER: "true"
      BASE_DOMAIN: wisp.place
      WISP_CACHE_INVALIDATION_STREAM: wisp:e2e:cache-invalidate-stream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  firehose-service:
    build:
      context: .
      dockerfile: apps/firehose-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wisp
      REDIS_URL: redis://redis:6379
      HEALTH_PORT: "3001"
      FIREHOSE_SERVICE: ${FIREHOSE_SERVICE:-wss://bsky.network}
      FIREHOSE_SERVICE_SECONDARY: ${FIREHOSE_SERVICE_SECONDARY:-}
      FIREHOSE_MAX_CONCURRENCY: "5"
      S3_BUCKET: wisp-e2e
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_PREFIX: sites/
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      WISP_CACHE_INVALIDATION_STREAM: wisp:e2e:cache-invalidate-stream
      WISP_REVALIDATE_STREAM: wisp:e2e:revalidate
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  hosting-service:
    build:
      context: .
      dockerfile: apps/hosting-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wisp
      REDIS_URL: redis://redis:6379
      BASE_HOST: wisp.place
      BASE_DOMAIN: wisp.place
      CACHE_DIR: /cache/sites
      HOT_CACHE_TTL: "300"
      S3_BUCKET: wisp-e2e
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_PREFIX: sites/
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      WISP_CACHE_INVALIDATION_STREAM: wisp:e2e:cache-invalidate-stream
      WISP_REVALIDATE_STREAM: wisp:e2e:revalidate
      WISP_CACHE_INVALIDATION_CURSOR_FILE: /cache/cache-invalidation.lastid
    volumes:
      - e2e_hosting_cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  e2e-runner:
    build:
      context: .
      dockerfile: apps/main-app/e2e/Dockerfile
    depends_on:
      main-app:
        condition: service_healthy
      firehose-service:
        condition: service_healthy
      hosting-service:
        condition: service_healthy
    environment:
      E2E_ATPROTO_HANDLE: ${E2E_ATPROTO_HANDLE:?Set E2E_ATPROTO_HANDLE to the test ATProto handle}
      E2E_ATPROTO_PASSWORD: ${E2E_ATPROTO_PASSWORD:?Set E2E_ATPROTO_PASSWORD to the test account password}
      E2E_APP_URL: http://127.0.0.1:8000
      E2E_APP_UPSTREAM: http://main-app:8000
      E2E_HOSTING_URL: http://hosting-service:3001
      E2E_FIREHOSE_URL: http://firehose-service:3001
      E2E_CLEANUP: ${E2E_CLEANUP:-true}
      E2E_HEADLESS: ${E2E_HEADLESS:-true}
      E2E_TIMEOUT_MS: ${E2E_TIMEOUT_MS:-180000}

volumes:
  e2e_postgres_data:
  e2e_redis_data:
  e2e_minio_data:
  e2e_hosting_cache:
