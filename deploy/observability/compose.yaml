name: wisp-observability

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics@sha256:407013e902f9a0ba1d4b2d4c077c47bbaf917c893c52ff39b19efe83a654afda
    container_name: wisp-victoria-metrics
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -httpListenAddr=:8428
      - -promscrape.config=/etc/victoriametrics/promscrape.yml
    ports:
      - 100.64.0.11:8428:8428
      - 10.88.0.10:8428:8428
    volumes:
      - /storage/wisp-observability/victoria-metrics:/storage
      - ./promscrape.yml:/etc/victoriametrics/promscrape.yml:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8428/health]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  victoria-logs:
    image: victoriametrics/victoria-logs@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
    container_name: wisp-victoria-logs
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -retention.maxDiskUsagePercent=80
      - -httpListenAddr=:9428
    ports:
      - 100.64.0.11:9428:9428
      - 10.88.0.10:9428:9428
    volumes:
      - /storage/wisp-observability/victoria-logs:/storage
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:1c1bd67c54c5fcf6e759897852b5a584191bd6796e8d328a5ace457799801261
    container_name: wisp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_ROOT_URL: http://100.64.0.11:3030
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource
    ports:
      - 100.64.0.11:3030:3000
      - 10.88.0.10:3030:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/infra-monitoring:/var/lib/grafana/infra-monitoring:ro
    depends_on:
      victoria-metrics:
        condition: service_healthy
      victoria-logs:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s

volumes:
  victoria_logs_data:
  grafana_data:
